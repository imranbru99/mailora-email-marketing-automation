name: mailora

x-app-environment: &app-environment
  APP_NAME: ${APP_NAME:-Mailora}
  APP_ENV: ${APP_ENV:-production}
  APP_DEBUG: ${APP_DEBUG:-false}
  APP_KEY: ${APP_KEY:?Run sh docker/configure.sh and use --env-file docker/.env}
  APP_URL: ${APP_URL:-http://localhost:8080}
  APP_MODE: ${APP_MODE:-self-hosted}
  APP_DEMO: ${APP_DEMO:-false}
  TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
  LOG_CHANNEL: stderr
  LOG_LEVEL: warning
  DB_CONNECTION: mysql
  DB_HOST: mysql
  DB_PORT: 3306
  DB_DATABASE: ${DB_DATABASE:-mailora}
  DB_USERNAME: ${DB_USERNAME:-mailora}
  DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in docker/.env}
  REDIS_CLIENT: phpredis
  REDIS_HOST: redis
  REDIS_PORT: 6379
  REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in docker/.env}
  CACHE_STORE: redis
  SESSION_DRIVER: redis
  SESSION_ENCRYPT: "true"
  SESSION_SECURE_COOKIE: ${SESSION_SECURE_COOKIE:-false}
  QUEUE_CONNECTION: redis
  REDIS_QUEUE_RETRY_AFTER: 300
  DB_QUEUE_RETRY_AFTER: 300
  FILESYSTEM_DISK: local
  MAIL_SANDBOX: ${MAIL_SANDBOX:-true}
  MAIL_MAILER: ${MAIL_MAILER:-log}
  MAIL_SCHEME: ${MAIL_SCHEME:-smtp}
  MAIL_HOST: ${MAIL_HOST:-localhost}
  MAIL_PORT: ${MAIL_PORT:-587}
  MAIL_USERNAME: ${MAIL_USERNAME:-}
  MAIL_PASSWORD: ${MAIL_PASSWORD:-}
  MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-hello@example.com}
  MAIL_FROM_NAME: ${MAIL_FROM_NAME:-Mailora}
  AI_HUB_UI: "false"
  AI_HUB_FILAMENT: "false"
  AI_CATALOG_API: "false"
  AI_CATALOG_STUDIO: "false"
  ATTENDANCE_ADMS_ENABLED: "false"
  ATTENDANCE_FILAMENT_ENABLED: "false"

x-app-service: &app-service
  image: mailora-app:local
  build:
    context: .
    target: app
  environment: *app-environment
  volumes:
    - app-storage:/var/www/html/storage
  depends_on:
    mysql:
      condition: service_healthy
    redis:
      condition: service_healthy
  restart: unless-stopped
  init: true
  stop_grace_period: 250s
  security_opt:
    - no-new-privileges:true

services:
  app:
    <<: *app-service

  web:
    image: mailora-web:local
    build:
      context: .
      target: web
    ports:
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-8080}:8080"
    volumes:
      - app-storage:/var/www/html/storage:ro
    depends_on:
      - app
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: [CMD-SHELL, "wget -q -O /dev/null http://127.0.0.1:8080/up || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  worker:
    <<: *app-service
    command: [php, artisan, horizon]

  scheduler:
    <<: *app-service
    command: [php, artisan, schedule:work]

  mysql:
    image: docker.io/library/mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-mailora}
      MYSQL_USER: ${DB_USERNAME:-mailora}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in docker/.env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in docker/.env}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: [CMD-SHELL, 'MYSQL_PWD="$$MYSQL_PASSWORD" mysql --host=127.0.0.1 --user="$$MYSQL_USER" --database="$$MYSQL_DATABASE" --execute="SELECT 1" >/dev/null']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  redis:
    image: docker.io/library/redis:7.4-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in docker/.env}
    command: [sh, -c, 'exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"']
    volumes:
      - redis-data:/data
    healthcheck:
      test: [CMD-SHELL, 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -q PONG']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  app-storage:
  mysql-data:
  redis-data:
